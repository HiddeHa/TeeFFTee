name: CI

# Every push, on every branch: the gates this project actually relies on.
# `npx playwright test` builds and serves the app on :3100 itself, with
# DATABASE_URL blanked, so no job needs a database, secrets or a prior build.
# The database specs run in the Playwright job and start their own Postgres
# containers, so that runner needs Docker — ubuntu-latest has it.
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Dates are compared against local midnight (the Set 19 guard, the "data as of"
  # chip), so a runner in another timezone must not change a result.
  TZ: UTC

jobs:
  typecheck-and-build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The unit suite and the content gate run before the build, so a push cannot
      # be green while the statistical core is broken or the set switch was missed
      # (the Set 19 guard lives in check:content).
      - run: npm run test:unit

      - run: npm run check:content

      # No DATABASE_URL in CI: the build reads the committed catalogue snapshot,
      # which is exactly how the deployed Worker renders too.
      - run: npm run build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The config switches the reporter to github + html and turns on retries
      # when CI is set, which Actions does for every step.
      # A skipped spec fails the run from inside it (e2e/skip-guard.ts): the
      # database specs skip themselves rather than fail when the throwaway
      # Postgres cannot start, which used to leave a green run missing half the
      # integration coverage.
      - run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
