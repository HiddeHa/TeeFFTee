name: CI

# Every push, on every branch: the three gates this project actually relies on.
# `npm run test:e2e` starts its own dev server on :3100 with DATABASE_URL blanked,
# so the job needs no database, no secrets and no prior build.
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck-and-build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # No DATABASE_URL in CI: the build reads the committed catalogue snapshot,
      # which is exactly how the deployed Worker renders too.
      - run: npm run build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The config switches the reporter to github + html and turns on retries
      # when CI is set, which Actions does for every step.
      - run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
